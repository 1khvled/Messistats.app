<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Lionel Messi: On This Day in History — MessiStats Widget</title>
<meta name="robots" content="noindex, follow"/>
<style>
  :root {
    --bg: #0d1726;
    --card: #152238;
    --card-inner: #1c2d4a;
    --line: rgba(255, 255, 255, 0.12);
    --text: #f0f4f8;
    --muted: #94a3b8;
    --gold: #e3b93e;
    --blue: #0e7cc0;
    --accent: #22d3ee;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --card-inner: #f1f5f9;
      --line: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --gold: #b45309;
      --blue: #0284c7;
      --accent: #0891b2;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 12px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  .widget {
    width: 100%;
    max-width: 500px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .w-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--line);
    padding-bottom: 8px;
  }
  .w-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 0.72rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--gold);
  }
  .w-date {
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--text);
  }
  .w-fixture {
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    background: var(--card-inner);
    padding: 8px 12px;
    border-radius: 8px;
  }
  .w-score {
    background: var(--blue);
    color: #fff;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 0.85rem;
    font-weight: 800;
  }
  .w-stats {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.82rem;
    color: var(--muted);
  }
  .w-pill {
    background: rgba(14, 124, 192, 0.15);
    color: var(--blue);
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 4px;
  }
  .w-video-box {
    width: 100%;
    border-radius: 8px;
    overflow: hidden;
    background: #000;
    display: none;
    margin-top: 4px;
  }
  .w-video-box video {
    width: 100%;
    max-height: 180px;
    display: block;
  }
  .w-actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 6px;
    border-top: 1px solid var(--line);
  }
  .w-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 0.78rem;
    font-weight: 700;
    padding: 5px 12px;
    border-radius: 999px;
    background: var(--blue);
    color: #fff;
    border: none;
    cursor: pointer;
    text-decoration: none;
  }
  .w-link {
    font-size: 0.72rem;
    color: var(--muted);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .w-link strong {
    color: var(--text);
  }
  .w-link:hover {
    text-decoration: underline;
  }
  .w-loading {
    font-size: 0.82rem;
    color: var(--muted);
    text-align: center;
    padding: 12px;
  }
</style>
</head>
<body>

<div class="widget" id="widget">
  <div class="w-header">
    <span class="w-badge">⚽ On This Day in Messi History</span>
    <span class="w-date" id="w-date">Loading…</span>
  </div>

  <div id="w-content">
    <div class="w-loading">Checking Messi's 929-goal match archive…</div>
  </div>

  <div class="w-actions">
    <a href="https://www.messistat.com/en/birthday" target="_blank" rel="noopener" class="w-link" id="w-powered-link">
      Powered by <strong>MessiStats.com</strong>
    </a>
    <a href="https://www.messistat.com/en/birthday" target="_blank" rel="noopener" class="w-btn" id="w-cta-btn">
      Search 366 Days &rarr;
    </a>
  </div>
</div>

<script>
(async function() {
  const dateEl = document.getElementById("w-date");
  const contentEl = document.getElementById("w-content");
  const ctaBtn = document.getElementById("w-cta-btn");
  const poweredLink = document.getElementById("w-powered-link");

  const urlParams = new URLSearchParams(window.location.search);
  let dateKey = urlParams.get("date");
  
  if (!dateKey) {
    const now = new Date();
    const m = String(now.getUTCMonth() + 1).padStart(2, "0");
    const d = String(now.getUTCDate()).padStart(2, "0");
    dateKey = `${m}-${d}`;
  }

  try {
    const res = await fetch("/data/birthday-goals.json");
    if (!res.ok) throw new Error("Data fetch error");
    const data = await res.json();
    const day = data.days && data.days[dateKey];

    if (!day) {
      contentEl.innerHTML = `<div class="w-loading">No match data on record for ${dateKey}.</div>`;
      return;
    }

    dateEl.textContent = day.formatted;
    ctaBtn.href = `https://www.messistat.com/en/birthday?date=${dateKey}`;
    poweredLink.href = `https://www.messistat.com/en/birthday?date=${dateKey}`;

    if (day.goalsCount > 0 && day.matches && day.matches.length > 0) {
      const match = day.matches[0];
      const hasVideo = match.videos && match.videos.length > 0;
      const videoUrl = hasVideo ? match.videos[0].videoUrl : null;

      contentEl.innerHTML = `
        <div class="w-fixture">
          <span>${match.team}</span>
          <span class="w-score">${match.score || "Won"}</span>
          <span>${match.opponent}</span>
        </div>
        <div class="w-stats">
          <span class="w-pill">⚽ ${match.goalsCount} ${match.goalsCount === 1 ? "Goal" : "Goals"}</span>
          <span>${match.competition || "Official Match"} (${match.year})</span>
        </div>
        ${videoUrl ? `
          <div class="w-video-box" id="w-video-box" style="display:block;">
            <video controls playsinline preload="none" poster="/img/og-messi.jpg" src="${videoUrl}"></video>
          </div>
        ` : ""}
      `;
    } else {
      contentEl.innerHTML = `
        <div style="font-size: 0.85rem; color: var(--muted); padding: 6px 0;">
          Lionel Messi had no competitive match on ${day.formatted}. Messi has scored on 292 of 366 calendar days!
        </div>
      `;
    }
  } catch(err) {
    contentEl.innerHTML = `<div class="w-loading">Explore all 929 Lionel Messi goals at messistat.com</div>`;
  }
})();
</script>

</body>
</html>
