name: Daily Messi Stats Scraper & Auto-Deploy

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC) covering post-match windows
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual one-click trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Python & Node Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4
          npm ci

      - name: Run 24h Scrapers & Auto-Sync
        run: |
          node scripts/auto-sync-matches.mjs
          node scripts/auto-sync-latest-goal.mjs
          node scripts/source-watch.mjs

      - name: Build & Run Verification Audits
        run: |
          npm run build
          npm run audit

      - name: Commit & Push New Match Stats
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/ index.html latest-goal.html dashboard.html birthday.html goalsbyseason.html goalsbyyear.html timeline.html achievements.html ar/ bn/ es/ fr/ hi/ pt/ ro/ uz/ public/sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "chore(stats): automated Messi stats sync [skip ci]"
            git push origin HEAD:${{ github.ref }}
            echo "Successfully synced new match data and pushed to remote."
          else
            echo "All stats up to date. No new match changes to commit."
          fi
