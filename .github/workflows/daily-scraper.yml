name: Daily Messi Stats Scraper & Auto-Deploy

on:
  schedule:
    # Runs every 10 minutes to instantly catch new matches and goals
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual one-click trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Scrapers & Auto-Sync
        run: |
          node scripts/daily-date-sync.mjs
          node scripts/auto-sync-matches.mjs
          node scripts/auto-sync-latest-goal.mjs
          node scripts/source-watch.mjs
          node scripts/auto-sync-ronaldo.mjs

      - name: Build & Run Verification Audits
        run: |
          npm run build
          npm run audit

      - name: Commit & Push New Match Stats
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          # Discard internal ephemeral watcher logs if no stats changed
          git checkout public/data/source-watch.json public/data/last-check.json public/data/pending.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(stats): daily Messi stats & freshness sync [skip ci]"
            git push origin HEAD:${{ github.ref }}
            echo "Successfully synced new match data and pushed to remote."
          else
            echo "All stats up to date. No new match changes to commit."
          fi
