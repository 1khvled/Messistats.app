# messi-stats: static site (dist/) + scheduled smart-check worker (free tier).
name = "messi-stats"
compatibility_date = "2026-09-01"
main = "worker/smart-check.js"

[assets]
directory = "./dist"
not_found_handling = "404-page"

# Smart schedule: ONE trigger, every 2h at minute 0 (12 runs/day).
# Free-tier facts, verified 2026-09-09 in developers.cloudflare.com:
# - Workers Free: 100,000 requests/day; max 5 cron triggers per account.
# - Cron syntax allows 1-minute intervals, so 2h is allowed and cheap.
# - Cron invocations get 15 min wall duration; 50 subrequests per run max.
# Escalation is worker-side gating (see worker/smart-check.js): non-matchday
# runs exit after 3 fetches + 1 D1 read; summary detail is fetched only when
# a match is scheduled today or unseen completed matches exist.
[triggers]
crons = ["0 */2 * * *"]

# D1 staging DB (free: 5M rows read/day, 100K rows written/day, 5GB storage,
# limits reset daily 00:00 UTC; enforced with errors since 2026-09-01).
# Setup (one time):
#   wrangler d1 create messi-stats-pending
#   wrangler d1 execute messi-stats-pending --file=worker/schema.sql
# Then replace REPLACE-WITH-D1-ID below with the real database_id.
[[d1_databases]]
binding = "DB"
database_name = "messi-stats-pending"
database_id = "REPLACE-WITH-D1-ID"